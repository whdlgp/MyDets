# convnext tiny backbone, PAN neck and RetinaNet head

common:
  image_size: [640, 640]           # width, height
  mean: [0.485, 0.456, 0.406]      # imagenet
  std: [0.229, 0.224, 0.225]

model:
  backbone:
    type: TimmBackbone
    args:
      name: convnext_tiny.fb_in1k    # timm model name with the weight tag
      out_indices: [1, 2, 3]         # strides 8, 16, 32
      pretrained: true
  neck:
    type: PAN
  head:
    type: RetinaNetHead

train:
  dataset_dir: data/voc
  batch_size: 16
  num_workers: 4
  epochs: 100
  warmup_epochs: 3
  freeze_epochs: 0
  close_mosaic_epochs: 15
  lr: 0.001
  weight_decay: 0.05
  ema: true
  amp: true
  seed: 0

predict:
