# convnext tiny backbone, CSPNeXtPAFPN neck and RTMDet head

common:
  image_size: [416, 416]           # width, height
  mean: [0.485, 0.456, 0.406]      # imagenet
  std: [0.229, 0.224, 0.225]

model:
  backbone:
    type: TimmBackbone
    args:
      name: convnext_tiny.fb_in1k  # timm name with the weight tag
      out_indices: [1, 2, 3]       # strides 8, 16, 32
      pretrained: true
  neck:
    type: CSPNeXtPAFPN
    args:
      out_channels: 256
      num_blocks: 3                # CSPNeXt blocks per CSP layer
      expand_ratio: 0.5            # hidden to output channels of each CSP layer
      depthwise: false             # depthwise separable 3x3 convs
      activation: silu             # gelu, relu or silu
  head:
    type: RTMDetSepBNHead
    args:
      hidden_channels: 256         # branch convs
      num_convs: 2                 # convs per branch
      share_conv: true             # branch convs shared over levels
      depthwise: false             # separable, not with share_conv
      exp_on_reg: true             # box distances as the exp of the predictions
      with_objectness: false       # objectness joins the class scores
      pred_kernel_size: 1          # kernel of the prediction convs
      activation: silu             # gelu, relu or silu
      topk: 13                     # top IoUs summed for the dynamic k
      soft_center_radius: 3.0      # soft center prior in strides
      iou_weight: 3.0              # weight of the IoU cost
      score_threshold: 0.001
      pre_nms_topk: 30000          # boxes kept per level before NMS
      nms_threshold: 0.65          # NMS IoU
      max_detections: 300          # per image

train:
  dataset_dir: data/coco
  batch_size: 16
  num_workers: 8
  epochs: 24
  warmup_epochs: 1                 # linear warmup
  freeze_epochs: 0                 # backbone frozen for the first epochs
  close_mosaic_epochs: 1           # mosaic off for the last N + 1 epochs
  lr: 0.001
  weight_decay: 0.05
  ema: true
  amp: true                        # bfloat16 if supported
  seed: 0
  transforms:                      # in order
    - type: RandomScale            # before RandomCrop
      args:
        max_scale: 1.4             # also inverted as the minimum
        step: 32                   # sides in multiples of this
    - type: RandomCrop
      args:
        jitter: 0.3                # crop or pad ratio of each side
    - type: RandomFlip
      args:
        probability: 0.5
    - type: RandomHSV
      args:
        hue: 0.1                   # ratio of the hue circle
        saturation: 1.5
        exposure: 1.5
    - type: Mosaic                 # after RandomCrop
      args:
        probability: 0.5
  val_transforms:
    - type: Letterbox
      args:
        fill: 128                  # padding gray

predict:
  score_threshold: 0.3             # minimum score of the drawn boxes
  transforms:
    - type: KeepRatioResize        # batches of one image
      args:
        step: 32                   # sides in multiples of this
